<section id="auth" class="page"><div class="heading"><h1>Conta Estuda Mais+</h1><p>Um perfil para acompanhar o teu percurso académico.</p></div><div class="authShell"><div class="authIntro"><div class="authBrand"><span class="logo iconLogo"><svg viewBox="0 0 64 64" aria-hidden="true" focusable="false"><path d="M8 17 31 5l25 11-25 12L8 17Z" fill="#1684ff"/><path d="M17 20 31 27 45 20 43 33 31 39 19 33Z" fill="#0754ce"/><path d="M9 17v16" stroke="#1684ff" stroke-width="3" stroke-linecap="round"/><circle cx="9" cy="36" r="3" fill="#1684ff"/><path d="M5 44 9 39l4 5-2 6H7Z" fill="#1684ff"/><g transform="rotate(-12 34 43)"><rect x="18" y="28" width="36" height="31" rx="7" fill="#087bff"/><rect x="21" y="25" width="32" height="31" rx="6" fill="#fff" stroke="#101d3c" stroke-width="2.5"/><path d="M37 31v19M28 40h18" stroke="#075bd8" stroke-width="7" stroke-linecap="round"/></g></svg></span><div><strong>Estuda Mais+</strong><small>Na vida e nos estudos, aprende-se praticando.</small></div></div><h2>Aprende, partilha e evolui.</h2><p>Uma comunidade feita para transformar dúvidas, ideias e prática em conhecimento.</p><div class="authHighlights"><span>Comunidades</span><span>Materiais</span><span>Projetos</span></div></div><div class="card authCard"><div class="profileHead"><div class="logo">E+</div><div><h2 style="margin:0">Bem-vindo</h2><p style="color:var(--muted);margin:2px 0">Aprender. Partilhar. Evoluir.</p></div></div><div class="authTabs"><button class="active" data-auth="login">Entrar</button><button data-auth="signup">Criar conta</button></div><form id="authForm"><div class="authFields" id="authFields"></div><button class="authButton" id="authSubmit" type="submit">Entrar</button></form><p class="authNote">Protótipo: não uses uma palavra-passe real. A autenticação ainda não está ligada.</p><button type="button" class="exploreButton" id="exploreDemo">Explorar sem conta</button></div><div class="premiumPanel"><span class="miniChip">ESPAÇO ACADÉMICO</span><h3 style="margin:12px 0 5px">O teu percurso, num só lugar.</h3><p style="font-size:12px;color:#c5c8da;margin:0">Materiais, comunidades, projetos e progresso de aprendizagem.</p></div></div></section><section id="definitions" class="page sectionHidden"><div class="heading"><h1>Definições</h1><p>O significado dos principais termos usados no Estuda Mais+.</p></div><article class="whitePage"><h2>Estuda Mais+</h2><p>Plataforma educativa em desenvolvimento, destinada à aprendizagem, partilha de recursos, discussão académica e colaboração em projetos.</p><h2>Utilizador</h2><p>Pessoa que acede ou utiliza a plataforma, com ou sem conta.</p><h2>Conta</h2><p>Perfil individual que, numa versão futura, permitirá guardar preferências, publicações e atividade. Na demonstração, a autenticação ainda não é real.</p><h2>Conteúdo</h2><p>Textos, perguntas, respostas, publicações, imagens, documentos, apontamentos, links ou outros materiais partilhados.</p><h2>Comunidade</h2><p>Espaço temático para estudantes se reunirem, partilharem conhecimento e conversarem sobre uma área ou interesse.</p><h2>Biblioteca</h2><p>Área de organização e descoberta de materiais de estudo e recursos educativos.</p><h2>Dados pessoais</h2><p>Informações que identificam ou podem identificar uma pessoa, como nome, contacto, localização ou outros dados associados.</p><h2>Cookies e armazenamento local</h2><p>Pequenas informações que o navegador pode guardar para recordar preferências ou interações. A demonstração pode utilizar armazenamento local do navegador.</p><h2>Protótipo / demonstração</h2><p>Versão experimental que permite explorar a interface, mas cujas funcionalidades podem não guardar dados, funcionar de forma permanente ou estar ligadas a serviços reais.</p><p class="legalUpdated">Documento informativo — versão de demonstração.</p></article></section><section id="cookies" class="page sectionHidden"><div class="heading"><h1>Cookies</h1><p>Uma explicação simples e transparente sobre o uso de cookies.</p></div><article class="whitePage"><h2>O que são cookies?</h2><p>Cookies são pequenos ficheiros guardados pelo navegador para ajudar um site a lembrar determinadas informações, como preferências e sessão.</p><h2>Como o Estuda Mais+ os utiliza</h2><p>Na versão atual de demonstração, usamos armazenamento local do navegador para lembrar algumas preferências e interações. A plataforma ainda não utiliza cookies de autenticação de uma conta real.</p><h2>Controlo</h2><p>Podes limpar os dados do site nas definições do teu navegador. Se futuramente forem adicionados cookies opcionais de análise ou personalização, serão explicados e apresentados de forma clara.</p><button class="primary" data-cookie-settings>Preferências de cookies</button><p class="legalUpdated">Documento informativo — versão de demonstração.</p></article></section>
<section id="terms" class="page sectionHidden"><div class="heading"><h1>Termos e condições</h1><p>Regras básicas para utilizar o Estuda Mais+ de forma respeitosa.</p></div><article class="whitePage"><h2>1. Sobre a plataforma</h2><p>Estuda Mais+ é um projeto educativo destinado a facilitar a partilha de conhecimentos, recursos, perguntas, ideias e projetos entre estudantes.</p><h2>2. Utilização adequada</h2><p>Utiliza a plataforma para fins académicos e educativos. Não publiques conteúdos que violem direitos de terceiros, exponham informações pessoais, promovam assédio, discriminação ou atividades ilegais.</p><h2>3. Conteúdos partilhados</h2><p>Confirma a qualidade e a origem dos materiais antes de os reutilizares. Respeita os direitos de autor e indica fontes sempre que possível. A publicação de demonstração não é enviada nem guardada num servidor.</p><h2>4. Conta e segurança</h2><p>As funcionalidades de conta ainda são protótipos. Não introduzas palavras-passe reais ou dados sensíveis em formulários de demonstração.</p><h2>5. Disponibilidade e alterações</h2><p>O projeto está em desenvolvimento. Funcionalidades, conteúdos e regras poderão ser ajustados para melhorar segurança, acessibilidade e experiência.</p><h2>6. Aceitação</h2><p>Ao utilizar o projeto, compromete-te a agir de forma respeitosa e responsável. Estes termos são informativos e ainda não constituem um documento jurídico final.</p><p class="legalUpdated">Versão de demonstração — 21 de novembro de 2026.</p></article></section>
<section id="responsibility" class="page sectionHidden"><div class="heading"><h1>Responsabilidades</h1><p>Um ambiente de aprendizagem colaborativo depende de todos.</p></div><article class="whitePage"><h2>Responsabilidade de quem utiliza</h2><ul><li>Partilhar informação com honestidade e indicar fontes.</li><li>Respeitar estudantes, professores, autores e diferentes opiniões.</li><li>Não publicar dados pessoais, palavras-passe ou informação privada de terceiros.</li><li>Verificar materiais e exercícios antes de os utilizar como referência.</li><li>Reportar conteúdos inadequados quando essa função estiver disponível.</li></ul><h2>Responsabilidade do projeto</h2><p>O Estuda Mais+ procura oferecer uma experiência educativa acessível, clara e respeitosa. Como o projeto ainda está em fase de protótipo, não garante armazenamento, disponibilidade permanente, verificação automática de conteúdos ou serviços de conta funcionais.</p><h2>Limites do conteúdo</h2><p>Materiais e publicações podem conter erros. A plataforma não substitui orientação docente, fontes oficiais ou avaliação crítica.</p><h2>Segurança e privacidade</h2><p>Evita introduzir dados pessoais em funcionalidades experimentais. A versão atual não possui autenticação real nem sistema completo de moderação.</p><p class="legalUpdated">Documento informativo — versão de demonstração.</p></article></section></main><aside class="right"><div class="card"><h3>Sobre o Estuda Mais+</h3><p>Uma comunidade académica para partilhar materiais, dúvidas, ideias e projetos. Aprender em conjunto.</p><div class="statline"><div><strong>5</strong><small>Áreas</small></div><div><strong>∞</strong><small>Aprendizagem</small></div></div></div><div class="card"><h3>A tua conta</h3><p>Cria um perfil académico para acompanhar projetos, comunidades e recursos.</p><button class="primary" style="width:100%" data-goto="auth">Entrar / Criar conta</button></div><div class="card"><h3>Começa por aqui</h3><p>Explora uma comunidade, encontra um material ou cria a tua primeira publicação de demonstração.</p></div></aside></div>

<script>
const communities=[["Matemática","Exercícios, dúvidas e explicações","∑","Disciplinas"],["Informática","Programação, tecnologia e projetos","⌘","Disciplinas"],["Física","Conceitos, fórmulas e experiências","⚛","Disciplinas"],["Português","Leitura, gramática e escrita","Aa","Disciplinas"],["Preparação para exames","Organização e preparação académica","✓","Cursos"],["Inglês para estudantes","Vocabulário e conversação","EN","Cursos"],["Vida académica","Experiências e apoio entre estudantes","⌂","Instituições"],["Projetos de Ciência","Pesquisa e iniciativas","✦","Instituições"]];
const resources=[["Guia de álgebra básica","Matemática","Resumo de conceitos e exercícios para praticar.","∑"],["Introdução à Física","Ciências","Conceitos fundamentais, grandezas e unidades.","⚛"],["Vocabulário inglês académico","Idiomas","Palavras e expressões para contexto escolar.","EN"],["Método de organização dos estudos","Todos","Planeamento, revisão e acompanhamento de tarefas.","▤"],["Fichas de exercícios de funções","Matemática","Prática guiada para funções e gráficos.","ƒ"],["Introdução ao método científico","Ciências","Observação, hipótese, teste e conclusão.","✦"]];
let page="auth",category="Todas",subject="Todos",kind="Nota",joined=new Set(),savedResources=new Set(),likes=0,commentCount=0,postCount=0,savedPost=false;
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.style.display="block";clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display="none",2200)}
function go(p){page=p;document.body.classList.toggle("authLanding",p==="auth");document.querySelector(".mobileNav").classList.toggle("sectionHidden",p==="auth");document.querySelectorAll(".page").forEach(el=>el.classList.toggle("sectionHidden",el.id!==p));document.querySelectorAll("[data-page]").forEach(el=>el.classList.toggle("active",el.dataset.page===p));document.querySelectorAll(".navbtn").forEach(el=>el.classList.toggle("active",el.dataset.page===p));window.scrollTo({top:0,behavior:"smooth"})}
document.querySelectorAll("[data-page]").forEach(el=>el.addEventListener("click",()=>go(el.dataset.page)));document.querySelectorAll("[data-goto]").forEach(el=>el.addEventListener("click",()=>go(el.dataset.goto)));
function drawCommunities(){const q=document.getElementById("communitySearch").value.toLowerCase();document.getElementById("communityList").innerHTML=communities.filter(c=>(category==="Todas"||c[3]===category)&&c.join(" ").toLowerCase().includes(q)).map(c=>'<div class="listItem"><div class="resourceIcon">'+c[2]+'</div><div class="info"><strong>'+c[0]+'</strong><small>'+c[1]+'</small></div><button class="join '+(joined.has(c[0])?"joined":"")+'" data-join="'+c[0]+'">'+(joined.has(c[0])?"Participando":"Participar")+'</button></div>').join("")||'<p style="color:var(--muted)">Nenhuma comunidade encontrada.</p>'}
document.getElementById("communitySearch").addEventListener("input",drawCommunities);document.querySelectorAll("[data-category]").forEach(b=>b.addEventListener("click",()=>{category=b.dataset.category;document.querySelectorAll("[data-category]").forEach(x=>x.classList.toggle("active",x===b));drawCommunities()}));document.getElementById("communityList").addEventListener("click",e=>{const b=e.target.closest("[data-join]");if(!b)return;const name=b.dataset.join;joined.has(name)?joined.delete(name):joined.add(name);drawCommunities();updateProfile()});
function drawResources(){const q=document.getElementById("librarySearch").value.toLowerCase();document.getElementById("resourceList").innerHTML=resources.filter(r=>(subject==="Todos"||r[1]===subject||r[1]==="Todos")&&r.join(" ").toLowerCase().includes(q)).map(r=>'<div class="listItem resource"><div class="resourceIcon">'+r[3]+'</div><div class="info"><strong>'+r[0]+'</strong><small>'+r[1]+' · '+r[2]+'</small></div><button class="saveBtn" data-save="'+r[0]+'">'+(savedResources.has(r[0])?"Guardado":"Guardar")+'</button></div>').join("")||'<p style="color:var(--muted)">Nenhum material encontrado.</p>'}
document.getElementById("librarySearch").addEventListener("input",drawResources);document.querySelectorAll("[data-subject]").forEach(b=>b.addEventListener("click",()=>{subject=b.dataset.subject;document.querySelectorAll("[data-subject]").forEach(x=>x.classList.toggle("active",x===b));drawResources()}));document.getElementById("resourceList").addEventListener("click",e=>{const b=e.target.closest("[data-save]");if(!b)return;const n=b.dataset.save;savedResources.has(n)?savedResources.delete(n):savedResources.add(n);drawResources();updateProfile()});
document.getElementById("globalSearch").addEventListener("input",e=>{const q=e.target.value.trim();if(q){go("library");document.getElementById("librarySearch").value=q;drawResources()}});
document.getElementById("likeBtn").addEventListener("click",()=>{likes=likes?0:1;document.getElementById("likeBtn").classList.toggle("active",!!likes);document.getElementById("likeBtn").textContent=likes?"♥ Gostei":"♡ Gostar";document.getElementById("likeStats").textContent=likes?"1 gosto":"Sem reações ainda"});
document.getElementById("savePostBtn").addEventListener("click",()=>{savedPost=!savedPost;document.getElementById("savePostBtn").classList.toggle("active",savedPost);document.getElementById("savePostBtn").textContent=savedPost?"▱ Guardado":"▱ Guardar";updateProfile()});
document.getElementById("commentBtn").addEventListener("click",()=>{const el=document.getElementById("commentArea");el.style.display=el.style.display==="none"?"flex":"none";if(el.style.display==="flex")document.getElementById("commentInput").focus()});
document.getElementById("sendComment").addEventListener("click",()=>{const inp=document.getElementById("commentInput"),txt=inp.value.trim();if(!txt)return;const c=document.createElement("div");c.style.cssText="padding:8px 16px;font-size:13px;border-top:1px solid var(--line)";c.textContent=txt;document.getElementById("comments").append(c);inp.value="";commentCount++;document.getElementById("commentStats").textContent=commentCount+" comentários"});
document.getElementById("shareBtn").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(location.href);toast("Link copiado")}catch{toast("Partilha este endereço com alguém")}});
document.querySelectorAll("[data-kind]").forEach(b=>b.addEventListener("click",()=>{kind=b.dataset.kind;document.querySelectorAll("[data-kind]").forEach(x=>x.classList.toggle("active",x===b))}));
document.getElementById("publishBtn").addEventListener("click",()=>{const title=document.getElementById("postTitle").value.trim(),body=document.getElementById("postBody").value.trim(),topic=document.getElementById("postTopic").value.trim();if(!body){document.getElementById("publishMessage").textContent="Escreve primeiro o conteúdo da publicação.";return}postCount++;const box=document.getElementById("newPostCard");box.innerHTML='<div class="card"><div class="postHead"><div class="avatar">E</div><div class="meta"><strong>Publicação de demonstração</strong><small>'+kind+(topic?" · "+topic:"")+'</small></div></div>'+(title?'<h3 style="padding:0 16px;margin:0">'+title+'</h3>':'')+'<p class="postText"></p></div>';box.querySelector(".postText").textContent=body;document.getElementById("publishMessage").textContent="Pré-visualização criada. Não é enviada para um servidor.";updateProfile();toast("Pré-visualização criada")});
function updateProfile(){document.getElementById("myPosts").textContent=postCount;document.getElementById("myJoined").textContent=joined.size;document.getElementById("mySaved").textContent=savedResources.size+(savedPost?1:0)}
document.body.classList.remove("drawerOpen","sidebarCollapsed");document.getElementById("sidebarToggle").addEventListener("click",()=>{if(window.innerWidth<=900){document.body.classList.toggle("drawerOpen")}else{document.body.classList.toggle("sidebarCollapsed")} });document.getElementById("drawerBackdrop").addEventListener("click",()=>document.body.classList.remove("drawerOpen"));document.querySelectorAll("[data-page]").forEach(el=>el.addEventListener("click",()=>{document.body.classList.remove("drawerOpen");go(el.dataset.page)}));const cookieBanner=document.getElementById("cookieBanner");if(!localStorage.getItem("em_cookie_choice"))cookieBanner.classList.add("show");function setCookieChoice(v){localStorage.setItem("em_cookie_choice",v);cookieBanner.classList.remove("show");toast("Preferência guardada neste navegador")}document.getElementById("cookieAccept").addEventListener("click",()=>setCookieChoice("accepted"));document.getElementById("cookieEssential").addEventListener("click",()=>setCookieChoice("essential"));document.querySelectorAll("[data-cookie-settings]").forEach(b=>b.addEventListener("click",()=>cookieBanner.classList.add("show")));document.querySelectorAll("[data-page]").forEach(el=>el.addEventListener("click",()=>document.body.classList.remove("drawerOpen")));drawCommunities();drawResources();updateProfile();go("auth");let authMode="login";function renderAuth(){const fields=document.getElementById("authFields");fields.innerHTML=authMode==="login"?' <input type="email" placeholder="Email" required><input type="password" placeholder="Palavra-passe" required>':'<input type="text" placeholder="Nome completo" required><input type="email" placeholder="Email" required><input type="password" placeholder="Criar palavra-passe" required>';document.getElementById("authSubmit").textContent=authMode==="login"?"Entrar":"Criar conta";document.querySelectorAll("[data-auth]").forEach(b=>b.classList.toggle("active",b.dataset.auth===authMode));}document.querySelectorAll("[data-auth]").forEach(b=>b.addEventListener("click",()=>{authMode=b.dataset.auth;renderAuth()}));document.getElementById("authForm").addEventListener("submit",e=>{e.preventDefault();toast("Protótipo: conta não criada. A entrar na demonstração.");go("home");});document.getElementById("exploreDemo").addEventListener("click",()=>go("home"));document.querySelectorAll("[data-auth-open]").forEach(b=>b.addEventListener("click",()=>go("auth")));renderAuth();
</script></body></html>
