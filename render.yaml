services:
  - type: web
    name: estudamais-api
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: RUN_MIGRATIONS
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: OAUTH_SERVER_URL
        sync: false
      - key: EXPO_PUBLIC_OAUTH_SERVER_URL
        sync: false
      - key: EXPO_PUBLIC_OAUTH_PORTAL_URL
        sync: false
      - key: EXPO_PUBLIC_APP_ID
        sync: false
      - key: BUILT_IN_FORGE_API_URL
        sync: false
      - key: BUILT_IN_FORGE_API_KEY
        sync: false
