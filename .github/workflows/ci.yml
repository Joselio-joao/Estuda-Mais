name: Verificação contínua

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Tipos e testes
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar pnpm
        run: npm install --global pnpm@9.12.0
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Verificar tipos
        run: pnpm check
      - name: Executar testes
        run: pnpm test
